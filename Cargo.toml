[package]
name = "mesh-lighthouse"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "match_lighthouse"
path = "src/lib.rs"

[[bin]]
name = "mesh-lighthouse"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
jev-sdk = "=0.1.0"
match-authority = { git = "https://github.com/bobishh/match.git", rev = "a43fbdf70334dc8fcc2759a2df9ed54a19621ed6" }
meta-mesh-core = { git = "https://github.com/bobishh/meta-mesh.git", rev = "c37ce967f51a0f7899542b26a659da08026fa5c0" }
meta-mesh-native = { git = "https://github.com/bobishh/meta-mesh.git", rev = "c37ce967f51a0f7899542b26a659da08026fa5c0" }
automerge = "0.12"
iroh = "1.2.0"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Signature admission runs on every live mesh frame. Keep scalar arithmetic
# optimized in local debug runs so multiple scopes do not stall heartbeats.
[profile.dev.package.ed25519-compact]
opt-level = 3
