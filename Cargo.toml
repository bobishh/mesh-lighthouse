[package]
name = "mesh-lighthouse"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "match_lighthouse"
path = "src/lib.rs"

[[bin]]
name = "mesh-lighthouse"
path = "src/main.rs"

[dependencies]
axum = "0.8"
async-trait = "0.1"
loco-rs = { version = "=1.2.0", default-features = false }
base64 = "0.22"
hmac = "0.12"
jev-sdk = "=0.1.0"
match-authority = { git = "https://github.com/bobishh/match.git", rev = "0f13c57ef36177a6edad7dd16e908ee43fe0a282" }
meta-mesh-core = { git = "https://github.com/bobishh/meta-mesh.git", rev = "03f51ccdefb491d0a1bd725197d027ccbb89a1d1" }
meta-mesh-native = { git = "https://github.com/bobishh/meta-mesh.git", rev = "03f51ccdefb491d0a1bd725197d027ccbb89a1d1" }
automerge = "0.12"
iroh = "1.2.0"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Signature admission runs on every live mesh frame. Keep scalar arithmetic
# optimized in local debug runs so multiple scopes do not stall heartbeats.
[profile.dev.package.ed25519-compact]
opt-level = 3
