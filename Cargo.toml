[package]
name = "mesh-lighthouse"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "match_lighthouse"
path = "src/lib.rs"

[[bin]]
name = "mesh-lighthouse"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
jev-sdk = "=0.1.0"
match-authority = { git = "https://github.com/bobishh/match.git", rev = "fa4e505f9f8b672e35846bab451b93dd9212f40f" }
meta-mesh-core = { git = "https://github.com/bobishh/meta-mesh.git", rev = "0bb9620acd9e7c0b4e3580026c68bedb89a5b984" }
meta-mesh-native = { git = "https://github.com/bobishh/meta-mesh.git", rev = "0bb9620acd9e7c0b4e3580026c68bedb89a5b984" }
automerge = "0.12"
iroh = "1.2.0"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Signature admission runs on every live mesh frame. Keep scalar arithmetic
# optimized in local debug runs so multiple scopes do not stall heartbeats.
[profile.dev.package.ed25519-compact]
opt-level = 3
